[project]
name = "dbrix-harness"
version = "0.1.0"
description = "Local Databricks medallion sandbox and AST execution harness (v0)"
requires-python = ">=3.12"
dependencies = [
    "delta-spark>=4.4.1",
    "docker>=7.1.0",
    "pydantic>=2.14.1",
    "pyspark>=4.2.0",
    "pyyaml>=6.0.2",
    "sqlglot>=30.24.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "types-docker>=7.1.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbrix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# under the repo: Docker Desktop can only bind-mount shared paths, and /tmp is not one
addopts = "-m 'not docker' --basetemp=.pytest_tmp"
markers = ["docker: needs Docker and the dbrix-spark image (run with -m docker)"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyspark.*", "delta.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
known-third-party = ["docker"]
